
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idle Warehouse 3.6</title>
<style>
:root{--bg:#101722;--panel:#192433;--panel2:#202e40;--line:#34465b;--text:#e8eef5;--muted:#9eafc2;--gold:#e8a83e;--green:#55c58a;--red:#e46c6c;--blue:#65a9e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#29394d;color:var(--text);padding:9px 12px;border-radius:7px}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:#a96e1c;border-color:#d99a36}
.good{background:#1e684b}
.danger{background:#743c42}
.wrap{max-width:1250px;margin:auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;color:var(--gold);margin:0}
h3{margin:0 0 9px}
.sub,.muted{color:var(--muted)}
.sub{font-size:12px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat,.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px}
.stat small{display:block;color:var(--muted);margin-bottom:5px}
.stat strong{font-size:18px}
.clock{background:#202d3d;border:1px solid #53657b;border-radius:9px;padding:12px;margin-bottom:10px}
.clocktop,.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#clockTime{font-size:25px;font-weight:bold;color:var(--gold)}
.progress,.bar{height:7px;background:#0d141d;border-radius:8px;overflow:hidden;margin-top:8px}
.progress>div,.bar>div{height:100%;background:var(--gold);width:0%;transition:width .2s}
nav{display:flex;gap:6px;overflow-x:auto;padding:5px 0 10px}
nav button{white-space:nowrap;background:#1b2838}
nav button.active{background:#a96e1c}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{margin-bottom:9px}
.card p{color:var(--muted);line-height:1.45;margin:6px 0}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-block;border:1px solid var(--line);padding:3px 7px;border-radius:5px;font-size:11px;color:var(--muted);margin:2px}
.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}
.vehicle{display:flex;gap:12px;align-items:center}
.vehicle img{width:120px;height:85px;object-fit:contain;background:#f4f5f6;border-radius:6px;padding:4px}
.vehicle .info{flex:1;min-width:140px}
.hero-image{width:100%;height:190px;object-fit:cover;border-radius:7px;margin:8px 0}
.worker-image{width:85px;height:85px;object-fit:cover;border-radius:8px;background:#26384b}
.photo-placeholder{width:85px;height:85px;border-radius:8px;background:#26384b;display:flex;align-items:center;justify-content:center;font-size:38px}
.event{border:1px solid var(--gold);background:#382d1b;padding:13px;border-radius:9px;margin:10px 0}
.event h3{color:#ffd28a}
.event p{color:#f1dfc5;line-height:1.45}
.event button{margin:4px}
.upgrade{border:1px solid var(--line);background:#1d2a3a;border-radius:8px;padding:12px;margin:9px 0}
.upgrade h4{margin:0 0 6px;font-size:15px}
.level{color:var(--gold);font-weight:bold}
input,select{background:#111b27;border:1px solid var(--line);color:var(--text);padding:9px;border-radius:6px}
footer{color:var(--muted);font-size:11px;text-align:center;padding:20px}
@media(max-width:650px){.wrap{padding:8px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.vehicle img{width:88px;height:68px}h1{font-size:19px}.hero-image{height:145px}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1>🏭 IDLE WAREHOUSE</h1><div class="sub">Symulator zarządzania przedsiębiorstwem logistycznym · Wersja 3.6</div></div>
 <button onclick="saveGame()">💾 Zapisz</button>
</header>

<section class="stats">
 <div class="stat"><small>Kapitał firmy</small><strong id="money">20 000 zł</strong></div>
 <div class="stat"><small>Reputacja</small><strong id="rep">0</strong></div>
 <div class="stat"><small>Magazyn</small><strong id="capacity">0 / 30</strong></div>
 <div class="stat"><small>Dzień działalności</small><strong id="day">1</strong></div>
</section>

<section class="clock">
 <div class="clocktop">
  <div><div class="muted" id="shiftLabel">Zmiana 1</div><div id="clockTime">08:00</div></div>
  <div style="text-align:right"><div class="muted">Do końca dnia</div><strong id="countdown">08:00:00</strong></div>
 </div>
 <div class="row" style="margin-top:8px">
  <span class="muted" id="speedLabel">Online: 1 godzina gry = 10 sekund</span>
  <span class="muted" id="statusLabel">Praca ciągła</span>
 </div>
 <div class="progress"><div id="dayProgress"></div></div>
</section>

<div id="eventArea"></div>
<nav>
 <button class="active" onclick="tab('company',this)">Firma</button>
 <button onclick="tab('warehouse',this)">Magazyn</button>
 <button onclick="tab('fleet',this)">Flota</button>
 <button onclick="tab('staff',this)">Pracownicy</button>
 <button onclick="tab('contracts',this)">Kontrakty</button>
 <button onclick="tab('development',this)">Rozwój</button>
 <button onclick="tab('finance',this)">Finanse</button>
 <button onclick="tab('reports',this)">Raporty</button>
</nav>
<main id="content"></main>
<footer>Idle Warehouse 3.6 · Zapis lokalny w przeglądarce.</footer>
</div>

<script>
"use strict";

const KEY="idleWarehouse_34";
const HOUR_ONLINE=10;
const HOUR_OFFLINE=20;
const MAX_OFFLINE=168;
const TAX_RATE=.08;

const IMG={
 RX18:"https://data.still.de/assets/products/Vehicles/Electric_Forklift_Trucks/RX_20_14-20/images/2020/STILL_RX20_2018_USP_Umschlagsleistung.jpg?fit=max&fm=webp&s=01b75d7b314d5fd27807548082c8df17&w=1920",
 RX20:"https://data.still.de/assets/products/Vehicles/Electric_Forklift_Trucks/RX_20_14-20/images/2020/STILL_RX20-Kampagne_HB-2020.jpg?fit=max&fm=webp&s=2b64b0a15860c05d4d9b807cbc352f86&w=1920",
 RX60:"https://data.still.de/assets/products/Vehicles/Electric_Forklift_Trucks/RX_20_14-20/images/2020/STILL_RX20-Kampagne_HB-2020.jpg?fit=max&fm=webp&s=2b64b0a15860c05d4d9b807cbc352f86&w=1920",
 WAREHOUSE:"https://www.toromontmh.com/media/wysiwyg/RW_JH_Racking_500x400_1.jpg",
 WORKER:"https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&w=600&q=85"
};

const MODELS={
 RX18:{name:"STILL RX18",load:1800,price:0,rent:1250,energy:32,throughput:2,image:IMG.RX18},
 RX20:{name:"STILL RX20",load:2000,price:96000,rent:2100,energy:38,throughput:2.3,image:IMG.RX20},
 RX60_30:{name:"STILL RX60-30",load:3000,price:184000,rent:4300,energy:53,throughput:2.5,image:IMG.RX60},
 RX60_50:{name:"STILL RX60-50",load:5000,price:296000,rent:6800,energy:72,throughput:2.7,image:IMG.RX60}
};

const COMPANIES=[
 ["Baltic Fresh Logistics","Dystrybucja żywności."],
 ["Domex AGD","Sprzęt gospodarstwa domowego."],
 ["MegaRetail Polska","Sieć handlowa."],
 ["SteelCore Components","Podzespoły przemysłowe."],
 ["NordBuild Materials","Materiały budowlane."],
 ["PortTech Heavy Industries","Przemysł ciężki."],
 ["AeroParts Systems","Elementy konstrukcyjne."],
 ["Konstruktor Polska","Maszyny i części."]
];

const FIRST_NAMES=["Adam","Michał","Paweł","Tomasz","Krzysztof","Piotr","Marcin","Łukasz","Mateusz","Jakub","Kamil","Rafał","Bartosz","Dawid","Wojciech","Daniel","Robert","Grzegorz","Filip","Maciej","Artur","Sebastian","Damian","Przemysław","Norbert","Patryk","Andrzej","Jan","Szymon","Oskar"];
const LAST_NAMES=["Nowak","Kowalski","Wiśniewski","Wójcik","Kamiński","Lewandowski","Zieliński","Szymański","Woźniak","Dąbrowski","Kozłowski","Jankowski","Mazur","Krawczyk","Piotrowski","Grabowski","Pawłowski","Michalski","Król","Wieczorek","Jabłoński","Wróbel","Nowicki","Majewski","Olszewski","Stępień","Malinowski","Adamczyk","Dudek","Górski"];

const UPGRADES={
 receiving:{name:"Optymalizacja przyjęć",desc:"Wprowadzenie harmonogramów awizacji, przydzielanie ramp do konkretnych dostaw, kontrola dokumentów przed przyjazdem pojazdu i lepsza organizacja rozładunku. Skraca postoje samochodów i ogranicza przestoje operatorów.",cost:[18000,40000,84000],effect:"+12% wydajności przyjęć na poziom"},
 picking:{name:"Optymalizacja kompletacji",desc:"Zmiana kolejności pobierania towaru, grupowanie zleceń i planowanie tras kompletacyjnych. Operatorzy rzadziej wracają do tych samych alejek, a wysyłki są przygotowywane sprawniej.",cost:[22000,48000,100000],effect:"+12% wydajności wysyłek na poziom"},
 training:{name:"Program rozwoju kompetencji",desc:"Wdrożenie matrycy kompetencji, okresowych ocen umiejętności i planów szkoleniowych. Pracownicy szybciej zdobywają doświadczenie podczas pracy.",cost:[16000,36000,70000],effect:"+25% przyrostu umiejętności na poziom"},
 wms:{name:"System WMS",desc:"Cyfrowa ewidencja lokalizacji, partii, numerów paletowych i stanów magazynowych. System ogranicza pomyłki oraz ułatwia kontrolę przepływu towaru.",cost:[32000,70000,140000],effect:"+8% ogólnej wydajności na poziom"},
 automation:{name:"Automatyzacja dokumentacji",desc:"Elektroniczny obieg dokumentów, automatyczne raporty, szablony przyjęć i wydań oraz ograniczenie ręcznego przepisywania danych.",cost:[24000,56000,110000],effect:"-8% kosztów administracyjnych na poziom"},
 planning:{name:"Planowanie pracy zmianowej",desc:"Wdrożenie harmonogramów pracy, planowania obsady, przydziału operatorów i koordynacji floty. Poziom 1 odblokowuje drugą zmianę, poziom 2 – trzecią zmianę.",cost:[24000,52000,104000],effect:"Odblokowuje kolejne zmiany i poprawia wykorzystanie zasobów"},
 bureaucracy:{name:"Optymalizacja biurokracji",desc:"Standaryzacja dokumentacji, procedur, obsługi kontraktów i kontroli administracyjnej. Pozwala obsługiwać większą liczbę zleceń.",cost:[20000,50000,110000,190000],effect:"Zwiększa limit aktywnych kontraktów o 2 na poziom"},
 iml:{name:"Wdrożenie IML – inteligentne zarządzanie przepływem",desc:"Wdrożenie zintegrowanego systemu zarządzania lokalizacjami i przepływem materiałów. IML analizuje kolejność zamówień, priorytety przyjęć i wydań oraz dostępność operatorów. Ogranicza zbędne przejazdy i poprawia płynność realizacji zamówień.",cost:[50000,110000,220000],effect:"+10% ogólnej wydajności na poziom"},
 slotting:{name:"Udrożnienie miejsc paletowych",desc:"Przebudowa rozmieszczenia towarów, przeniesienie szybko rotujących produktów bliżej stref wydań, uporządkowanie alejek i eliminacja punktów kolizyjnych. Operatorzy pokonują krótsze trasy, a dostęp do lokalizacji jest szybszy.",cost:[42000,95000,190000],effect:"+12% wydajności operacyjnej na poziom"}
};

function fresh(){
 return {
  money:20000,rep:0,day:1,gameHour:0,hourProgress:0,dayHours:0,
  shiftCount:1,pendingEvent:null,lastSeen:Date.now(),
  taxCycleRevenue:0,
  warehouse:{level:1,capacity:30,condition:100,serviceCenter:false,canteen:false,smoking:false},
  upgrades:{receiving:0,picking:0,training:0,wms:0,automation:0,planning:0,bureaucracy:0,iml:0,slotting:0},
  employees:[
   {id:1,name:"Jan Kowalski",role:"Magazynier",salary:3800,hours:180,skill:0,udt:true,promotionLevel:0,trainedBasic:false,trainedAdvanced:false}
  ],
  fleet:[{id:1,model:"RX18",rented:true,condition:92,hours:1250,broken:false}],
  contracts:[],offers:[],nextId:2,
  finances:{income:0,cost:0,penalties:0,tax:0},
  log:["Rozpoczęto działalność. Kapitał początkowy: 20 000 zł."]
 };
}

let S;
try{
 S=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem("idleWarehouse_32"))||JSON.parse(localStorage.getItem("idleWarehouse_33"))||fresh();
}catch(e){S=fresh();}

function migrate(){
 S.warehouse=S.warehouse||{level:1,capacity:30,condition:100};
 Object.assign(S.warehouse,{condition:S.warehouse.condition??100,serviceCenter:S.warehouse.serviceCenter??false,canteen:S.warehouse.canteen??false,smoking:S.warehouse.smoking??false});
 S.upgrades=S.upgrades||{};
 Object.keys(UPGRADES).forEach(k=>S.upgrades[k]??=0);
 S.employees=S.employees||[];
 S.fleet=S.fleet||[];
 S.contracts=S.contracts||[];
 S.offers=S.offers||[];
 S.log=S.log||[];
 S.finances=S.finances||{income:0,cost:0,penalties:0};
 S.finances.income??=0;S.finances.cost??=0;S.finances.penalties??=0;S.finances.tax??=0;
 S.taxCycleRevenue??=0;
 S.day??=1;S.gameHour??=0;S.hourProgress??=0;S.dayHours??=0;
 S.shiftCount??=1;S.rep??=0;S.nextId??=2;S.lastSeen??=Date.now();
 S.employees.forEach(e=>{
  e.hours??=0;e.skill??=0;e.udt??=true;
  e.promotionLevel??=0;e.trainedBasic??=false;e.trainedAdvanced??=false;
  if(!e.name||/^Nowy (magazynier|operator|pracownik)$/i.test(e.name))e.name=generateName();
 });
 S.fleet.forEach(v=>{v.condition??=90;v.hours??=0;v.broken??=false;});
}
migrate();

let activeTab="company";
let lastFrame=Date.now();

function money(n){return Math.round(n).toLocaleString("pl-PL")+" zł";}
function num(n){return Math.floor(n).toLocaleString("pl-PL");}
function decimal(n){return Number(Number(n||0).toFixed(1)).toLocaleString("pl-PL",{minimumFractionDigits:0,maximumFractionDigits:1});}
function log(t){S.log.unshift("Dzień "+S.day+": "+t);S.log=S.log.slice(0,100);}
function saveGame(){S.lastSeen=Date.now();localStorage.setItem(KEY,JSON.stringify(S));}
function level(k){return S.upgrades[k]||0;}
function mult(k,v){return 1+level(k)*v;}
function activeContracts(){return S.contracts.filter(c=>!c.completed&&!c.failed);}
function contractLimit(){return [0,2,5,20][S.shiftCount]+level("bureaucracy")*2;}
function occupied(){return S.contracts.reduce((a,c)=>a+(c.batches||[]).reduce((b,x)=>b+x.qty,0),0);}
function freeSpace(){return Math.max(0,S.warehouse.capacity-occupied());}
function operatorRoles(){return ["Magazynier","Starszy magazynier","Koordynator magazynu","Starszy koordynator magazynu","Pracownik transportu wewnętrznego","Starszy pracownik transportu wewnętrznego","Lider operatorów","Starszy operator"];}
function operators(){return S.employees.filter(e=>operatorRoles().includes(e.role)).length;}
function manager(){return S.employees.find(e=>e.role==="Kierownik transportu");}
function safety(){return S.employees.find(e=>e.role==="Audytor BHP");}
function forklifts(){return S.fleet.filter(v=>!v.broken&&v.condition>0);}
function fmtHour(h){h=((h%24)+24)%24;return String(Math.floor(h)).padStart(2,"0")+":"+String(Math.floor(h%1*60)).padStart(2,"0");}
function startClock(){return S.shiftCount===1?8:6;}
function dayLength(){return 8*S.shiftCount;}
function currentClock(){return fmtHour(startClock()+S.dayHours);}
function shiftName(){return "Zmiana "+Math.min(S.shiftCount,Math.floor(S.dayHours/8)+1)+" / "+S.shiftCount;}
function currentCountdown(){
 let n=Math.max(0,dayLength()-S.dayHours-S.hourProgress)*HOUR_ONLINE;
 return [Math.floor(n/3600),Math.floor(n%3600/60),Math.floor(n%60)].map(x=>String(x).padStart(2,"0")).join(":");
}
function charge(n){if(S.money<n)return false;S.money-=n;S.finances.cost+=n;return true;}
function credit(n){S.money+=n;S.finances.income+=n;S.taxCycleRevenue=(S.taxCycleRevenue||0)+n;}
function generateName(){
 let first=FIRST_NAMES[Math.floor(Math.random()*FIRST_NAMES.length)];
 let last=LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)];
 return first+" "+last;
}

function throughput(){
 let staff=operators(),trucks=forklifts();
 if(!staff||!trucks.length)return 0;
 let machine=trucks.reduce((a,v)=>a+(MODELS[v.model]?.throughput||1),0);
 let base=Math.min(staff*2.2,machine);
 base*=mult("receiving",.12)*mult("picking",.12)*mult("wms",.08)*mult("planning",.10);
 base*=mult("iml",.10)*mult("slotting",.12);
 let mgr=manager();
 if(mgr)base*=1.15+Math.min(0.15,mgr.skill/500);
 let avg=S.employees.filter(e=>operators()&&operatorRoles().includes(e.role)).reduce((a,e)=>a+e.skill,0)/Math.max(1,operators());
 base*=1+avg/250;
 if(S.warehouse.condition<70)base*=.7;
 if(S.warehouse.condition<40)base*=.5;
 return Math.max(0,base);
}
function onBreak(){
 let within=S.dayHours%8;
 return within>=3.5&&within<4;
}
function shiftWorkFactor(){return onBreak()?0:1;}

function promotionCheck(e){
 let next=e.promotionLevel||0;
 while(next<3&&e.hours>=[200,400,600][next]){
  next++;
  e.promotionLevel=next;
  if(e.role==="Magazynier"||e.role==="Starszy magazynier"||e.role==="Koordynator magazynu"){
   if(next===1){e.role="Starszy magazynier";e.salary=4300;}
   if(next===2){e.role="Koordynator magazynu";e.salary=4900;}
   if(next===3){e.role="Starszy koordynator magazynu";e.salary=5600;}
  }else if(e.role==="Pracownik transportu wewnętrznego"||e.role==="Starszy pracownik transportu wewnętrznego"||e.role==="Lider operatorów"){
   if(next===1){e.role="Starszy pracownik transportu wewnętrznego";e.salary=5200;}
   if(next===2){e.role="Lider operatorów";e.salary=5900;}
   if(next===3){e.role="Starszy operator";e.salary=6700;}
  }
  log("Awans pracownika "+e.name+" – "+e.role+". Nowe wynagrodzenie: "+money(e.salary)+".");
 }
}

function renderTop(){
 document.getElementById("money").textContent=money(S.money);
 document.getElementById("rep").textContent=num(S.rep);
 document.getElementById("capacity").textContent=decimal(occupied())+" / "+S.warehouse.capacity;
 document.getElementById("day").textContent=S.day;
 document.getElementById("clockTime").textContent=currentClock();
 document.getElementById("shiftLabel").textContent=shiftName();
 document.getElementById("countdown").textContent=currentCountdown();
 document.getElementById("dayProgress").style.width=(S.dayHours/dayLength()*100)+"%";
 document.getElementById("statusLabel").textContent=S.pendingEvent?"Oczekiwanie na decyzję":onBreak()?"Przerwa pracowników":"Praca ciągła";
 document.getElementById("speedLabel").textContent="Online: 1 godzina = 10 sekund · Offline: 20 sekund";
}
function renderEvent(){
 let el=document.getElementById("eventArea");
 if(!el)return;
 if(!S.pendingEvent){el.innerHTML="";return;}
 let e=S.pendingEvent;
 el.innerHTML=`<div class="event"><h3>⚠ ${e.title}</h3><p>${e.desc}</p>
 ${e.choices.map((c,i)=>`<button type="button" onclick="resolveEvent(${i})">${c.label}</button>`).join("")}
 <div class="muted">Zegar wznowi pracę po podjęciu decyzji.</div></div>`;
}
function setEvent(title,desc,choices){
 S.pendingEvent={title,desc,choices};
 renderEvent();
}
function resolveEvent(i){
 let e=S.pendingEvent;if(!e)return;
 let choice=e.choices[i];if(!choice)return;
 applyEventChoice(e.type,i);
 log(e.title+" — "+choice.label);
 S.pendingEvent=null;
 render();
}
function applyEventChoice(type,i){
 if(type==="pallet"){
  let c=activeContracts()[0];
  if(i===0){if(charge(500)){if(c&&c.batches.length)c.batches[0].qty=Math.max(0,c.batches[0].qty-1);log("Przepakowano uszkodzoną paletę.");}else S.rep=Math.max(0,S.rep-1);}
  else if(i===1){
   if(Math.random()<(safety()?.skill?0.12:0.3)){S.warehouse.condition=Math.max(0,S.warehouse.condition-12);S.rep=Math.max(0,S.rep-2);log("Doszło do wypadku podczas obsługi uszkodzonej palety.");}
   else log("Paletę zabezpieczono bez dalszych konsekwencji.");
  }
 }
 if(type==="label"){
  if(i===0){S.rep=Math.max(0,S.rep-1);if(activeContracts()[0])activeContracts()[0].incoming=Math.max(0,activeContracts()[0].incoming-1);}
  else if(i===1&&activeContracts()[0])activeContracts()[0].batches.push({qty:1,readyAt:S.gameHour+activeContracts()[0].storageHours*2});
 }
 if(type==="overtime"){
  if(i===0){
   let cost=S.employees.reduce((a,e)=>a+Math.round(e.salary/240*1.5),0);
   if(charge(cost)){S.contracts.filter(c=>!c.completed&&!c.failed).forEach(c=>c.deadlineHour+=2);log("Nadgodziny uruchomione. Dodatkowe koszty: "+money(cost));}
   else log("Brak środków na nadgodziny.");
  }
 }
 if(type==="truck"){
  let v=S.fleet.find(x=>!x.broken);
  if(i===0){if(charge(1800)&&v){v.condition=Math.min(100,v.condition+20);v.broken=false;}}

function hourlyTick(online){
 S.gameHour++;
 S.dayHours++;
 let working=!onBreak();
 let cap=working?throughput():0;
 let remaining=cap,movement=0;

 for(let c of activeContracts()){
  for(let b of c.batches){
   if(b.readyAt<=S.gameHour&&remaining>0){
    let n=Math.min(b.qty,remaining);
    b.qty-=n;remaining-=n;movement+=n;c.delivered+=n;
   }
  }
  c.batches=c.batches.filter(b=>b.qty>0);
 }
 for(let c of activeContracts()){
  if(remaining<=0)break;
  let space=freeSpace();
  let n=Math.min(c.incoming,remaining,space);
  if(n>0){c.incoming-=n;c.batches.push({qty:n,readyAt:S.gameHour+c.storageHours});remaining-=n;movement+=n;}
 }

 if(working){
  S.employees.forEach(e=>{
   if(e.role==="Mechanik")return;
   e.hours++;
   e.skill=Math.min(100,e.skill+(e.role==="Magazynier"?.035:.055)*mult("training",.25));
   promotionCheck(e);
  });
 }
 S.fleet.forEach(v=>{
  if(v.broken)return;
  v.hours++;
  if(!v.rented){
   let managerReduction=manager()?.skill?Math.min(.5,manager().skill/200):0;
   v.condition=Math.max(0,v.condition-.035*(1-managerReduction));
   if(v.condition<15)v.broken=true;
  }
 });
 let managerProtection=manager()?0.55:1;
 let safetyProtection=safety()?0.85:1;
 let shiftMultiplier=1+(S.shiftCount-1)*.65;
 let fleetMultiplier=1+Math.max(0,S.fleet.length-1)*.22;
 let wear=movement*.025*shiftMultiplier*fleetMultiplier*managerProtection*safetyProtection;
 S.warehouse.condition=Math.max(0,S.warehouse.condition-wear-.006*shiftMultiplier);

 S.contracts.forEach(c=>{
  if(c.completed||c.failed)return;
  if(c.delivered>=c.pallets&&c.incoming===0&&c.batches.length===0){
   c.completed=true;S.rep+=c.repReward;log("Zrealizowano kontrakt: "+c.company);
  }
  if(S.gameHour>=c.deadlineHour&&!c.completed){
   c.failed=true;S.money-=c.advance+c.penalty;S.finances.penalties+=c.advance+c.penalty;
   c.incoming=0;c.batches=[];S.rep=Math.max(0,S.rep-3);
   log("Nie dotrzymano terminu kontraktu "+c.company+".");
  }
 });
 if(online)randomEvent();
 if(S.dayHours>=dayLength())endDay();
}

/* MIESIĘCZNE KOSZTY I PODATKI */

function monthlyCosts(){
 let wages=S.employees.reduce((a,e)=>a+e.salary,0);
 let rent=S.fleet.filter(v=>v.rented).reduce((a,v)=>a+(MODELS[v.model]?.rent||0),0);
 let shiftFactor=1+(S.shiftCount-1)*.75;
 let electricity=(500+S.fleet.reduce((a,v)=>a+(MODELS[v.model]?.energy||0)*8*30,0))*shiftFactor;
 let water=(250+S.employees.length*110)*shiftFactor;
 let clothing=S.employees.length*180;
 let land=700+S.warehouse.level*850+S.warehouse.capacity*12;
 let maintenance=250+S.warehouse.level*100;
 let social=(S.warehouse.canteen?4500:0)+(S.warehouse.smoking?900:0);
 let administration=0;
 let total=wages+rent+electricity+water+clothing+land+maintenance+social+administration;
 total*=Math.max(.5,1-level("automation")*.08);
 return {wages,rent,electricity,water,clothing,land,maintenance,social,total};
}

function daysToMonthEnd(){
 return 30-(S.day%30);
}
function taxDueAtNextSettlement(){
 return (S.day+daysToMonthEnd())%180===0;
}
function estimatedTax(){
 return taxDueAtNextSettlement()?(S.taxCycleRevenue||0)*TAX_RATE:0;
}
function nextSettlementForecast(){
 let costs=monthlyCosts();
 let tax=estimatedTax();
 return {...costs,tax,grand:costs.total+tax,days:daysToMonthEnd()};
}
function monthlySettlement(){
 let costs=monthlyCosts();
 let total=costs.total;
 S.money-=total;
 S.finances.cost+=total;
 log("Rozliczenie miesięczne. Koszty utrzymania firmy: "+money(total)+".");
 if(S.day%180===0){
  let revenue=S.taxCycleRevenue||0;
  let tax=revenue*TAX_RATE;
  S.money-=tax;
  S.finances.cost+=tax;
  S.finances.tax=(S.finances.tax||0)+tax;
  S.taxCycleRevenue=0;
  log("Półroczny podatek od przychodu (8%): "+money(tax)+". Przychód w okresie: "+money(revenue)+".");
 }
}

function endDay(){
 S.dayHours=0;
 S.day++;
 if(S.day%30===0)monthlySettlement();
 generateOffers();
}

function tickFrame(){
 let now=Date.now(),delta=Math.min(1000,now-lastFrame);
 lastFrame=now;
 if(!S.pendingEvent){
  S.hourProgress+=delta/1000/HOUR_ONLINE;
  while(S.hourProgress>=1){
   S.hourProgress-=1;
   hourlyTick(true);
   if(S.pendingEvent)break;
  }
 }
 renderTop();
 requestAnimationFrame(tickFrame);
}

function applyOffline(){
 let now=Date.now();
 let seconds=Math.max(0,(now-(S.lastSeen||now))/1000);
 let hours=Math.min(MAX_OFFLINE,seconds/HOUR_OFFLINE);
 let full=Math.floor(hours);
 for(let i=0;i<full;i++)hourlyTick(false);
 S.hourProgress+=hours-full;
 while(S.hourProgress>=1){S.hourProgress-=1;hourlyTick(false);}
 if(full)log("Symulacja offline: "+full+" godzin.");
 S.lastSeen=now;
}
applyOffline();

 <p>Audytor BHP kontroluje procedury, oznakowanie i bezpieczeństwo pracy. Ogranicza ryzyko wypadków i szkód.</p>
 <p>Wynagrodzenie: 5 800 zł/mies. · wyposażenie 650 zł</p>
 ${safety()?"<span class=green>Audytor BHP zatrudniony.</span>":'<button onclick="hireSafety()">Zatrudnij audytora BHP</button>'}
 </div>`;
 return html;
}
function trainEmployee(id,type){
 let e=S.employees.find(x=>x.id===id);if(!e)return;
 if(type==="basic"){
  if(e.trainedBasic)return;
  if(!charge(1400)){alert("Brak środków na szkolenie podstawowe.");return;}
  e.trainedBasic=true;e.skill=Math.min(100,e.skill+8);
  log("Szkolenie podstawowe ukończone: "+e.name+".");
 }else{
  if(!e.trainedBasic||e.trainedAdvanced)return;
  if(!charge(3600)){alert("Brak środków na szkolenie dodatkowe.");return;}
  e.trainedAdvanced=true;e.skill=Math.min(100,e.skill+18);
  log("Szkolenie dodatkowe ukończone: "+e.name+".");
 }
 render();
}
function hire(role){
 let salary=role==="Magazynier"?3800:4600;
 let total=salary+650;
 if(S.employees.length>=20||!charge(total)){alert("Brak środków lub osiągnięto limit personelu. Potrzebujesz również 650 zł na wyposażenie.");return;}
 S.employees.push({id:S.nextId++,name:generateName(),role,salary,hours:0,skill:0,udt:true,promotionLevel:0,trainedBasic:false,trainedAdvanced:false});
 log("Zatrudniono: "+S.employees[S.employees.length-1].name+". Koszt wyposażenia: 650 zł.");
 render();
}
function hireManager(){
 if(manager())return;
 if(!charge(2150)){alert("Brak środków na rekrutację i wyposażenie.");return;}
 S.employees.push({id:S.nextId++,name:generateName(),role:"Kierownik transportu",salary:7500,hours:0,skill:40,promotionLevel:0,trainedBasic:false,trainedAdvanced:false});
 log("Zatrudniono kierownika transportu.");render();
}
function hireSafety(){
 if(safety())return;
 if(level("bureaucracy")<1){alert("Najpierw odblokuj podstawowe procedury w dziale Rozwój.");return;}
 if(!charge(1850)){alert("Brak środków na rekrutację i wyposażenie.");return;}
 S.employees.push({id:S.nextId++,name:generateName(),role:"Audytor BHP",salary:5800,hours:0,skill:40,promotionLevel:0,trainedBasic:false,trainedAdvanced:false});
 log("Zatrudniono audytora BHP.");render();
}
function fireEmployee(id){
 if(S.employees.length<=1){alert("Firma musi mieć pracownika.");return;}
 let e=S.employees.find(x=>x.id===id);
 if(!e)return;
 S.employees=S.employees.filter(x=>x.id!==id);
 log("Zwolniono: "+e.name);render();
}

function generateOffers(){
 S.offers=[];
 let active=activeContracts().length;
 if(active>=contractLimit())return;
 let base=[
  {p:8,storage:3,days:3,advance:2500,penalty:1000,load:1800,rep:1},
  {p:12,storage:4,days:3,advance:4500,penalty:1800,load:1800,rep:2},
  {p:18,storage:8,days:4,advance:7000,penalty:2500,load:2000,rep:3},
  {p:25,storage:12,days:5,advance:11000,penalty:4000,load:2000,rep:4}
 ];
 if(S.warehouse.level>=2)base.push({p:30,storage:16,days:6,advance:17000,penalty:6000,load:3000,rep:5});
 if(S.warehouse.level>=3)base.push({p:35,storage:24,days:8,advance:28000,penalty:10000,load:3000,rep:8});
 let count=Math.min(3,contractLimit()-active);
 for(let i=0;i<count;i++){
  let b=base[Math.floor(Math.random()*base.length)];
  let co=COMPANIES[Math.floor(Math.random()*COMPANIES.length)];
  S.offers.push({...b,id:S.nextId++,company:co[0],desc:co[1]});
 }
}
function contractsView(){
 if(!S.offers.length&&activeContracts().length<contractLimit())generateOffers();
 let html=`<div class="card"><h3>📑 Kontrakty</h3>
 <div class="row"><span>Aktywne kontrakty</span><b>${activeContracts().length} / ${contractLimit()}</b></div>
 <p>Limit zależy od liczby zmian i poziomu biurokracji. Rozwój administracji zwiększa możliwości obsługi zleceń.</p>
 <button onclick="generateOffers();render()">Odśwież oferty</button></div>`;
 S.offers.forEach(o=>{
  html+=`<div class="card"><div class="row"><h3>${o.company}</h3><span class="tag">${o.p} palet</span></div>
  <p>${o.desc}</p>
  <div class="row"><span>Składowanie</span><b>${o.storage} h</b></div>
  <div class="row"><span>Termin</span><b>${o.days} dni</b></div>
  <div class="row"><span>Zaliczka</span><b class=green>${money(o.advance)}</b></div>
  <div class="row"><span>Kara</span><b class=red>${money(o.penalty)}</b></div>
  <button class="primary" onclick="acceptContract(${o.id})">Przyjmij kontrakt</button></div>`;
 });
 html+=`<div class="card"><h3>📦 Realizowane kontrakty</h3>
 ${activeContracts().map(c=>`<div class=card><b>${c.company}</b>
 <div class=row><span>Palety</span><b>${decimal(c.delivered)} / ${c.pallets}</b></div>
 <div class=row><span>Do rozładunku</span><b>${decimal(c.incoming)}</b></div>
 <div class=row><span>Miejsce zajęte w magazynie</span><b>${decimal(c.batches.reduce((a,b)=>a+b.qty,0))} palet</b></div>
 <div class=row><span>Termin</span><b>${decimal(Math.max(0,c.deadlineHour-S.gameHour))} h gry</b></div>
 <div class=bar><div style="width:${c.delivered/c.pallets*100}%"></div></div></div>`).join("")||'<p class=muted>Brak aktywnych kontraktów.</p>'}
 </div>`;
 return html;
}
function acceptContract(id){
 let o=S.offers.find(x=>x.id===id);if(!o)return;
 if(activeContracts().length>=contractLimit()){alert("Osiągnięto limit aktywnych kontraktów.");return;}
 if(!S.fleet.some(v=>(MODELS[v.model]?.load||0)>=o.load&&!v.broken)){alert("Brak sprawnego wózka o wymaganym udźwigu.");return;}
 if(o.p>S.warehouse.capacity*2){alert("Kontrakt jest zbyt duży dla obecnego magazynu.");return;}
 credit(o.advance);
 S.contracts.push({id:o.id,company:o.company,pallets:o.p,storageHours:o.storage,deadlineHour:S.gameHour+o.days*24,advance:o.advance,penalty:o.penalty,incoming:o.p,batches:[],delivered:0,completed:false,failed:false,repReward:o.rep});
 S.offers=S.offers.filter(x=>x.id!==id);
 log("Przyjęto kontrakt: "+o.company);render();
}

function developmentView(){
 let html=`<div class=card><h3>📈 Rozwój przedsiębiorstwa</h3>
 <p>Inwestycje poprawiają wydajność, organizację pracy i bezpieczeństwo. Koszty rozwoju zostały podniesione – decyzje inwestycyjne wymagają teraz planowania budżetu.</p>
 <div class=row><span>Wydajność magazynu</span><b>${decimal(throughput())} pal./h</b></div>
 <div class=row><span>Poziom biurokracji</span><b>${level("bureaucracy")}/4</b></div>
 <div class=row><span>Planowanie pracy</span><b>${level("planning")}/3</b></div>
 </div>`;
 Object.entries(UPGRADES).forEach(([k,u])=>{
  let lv=level(k),max=u.cost.length,cost=u.cost[lv];
  html+=`<div class=upgrade><div class=row><h4>${u.name}</h4><span class=level>${lv}/${max}</span></div>
  <p>${u.desc}</p><p class=green>${u.effect}</p>
  <div class=bar><div style="width:${lv/max*100}%"></div></div>
  <div class=row><span class=muted>${lv>=max?"Maksymalny poziom":money(cost)}</span>
  <button class=primary onclick="buyUpgrade('${k}')" ${lv>=max?"disabled":""}>${lv>=max?"Maksimum":"Ulepsz"}</button></div></div>`;
 });
 html+=`<div class=card><h3>🏗 Centrum serwisowe</h3>
 <p>Własne zaplecze techniczne pozwala zatrudniać mechaników w kolejnych etapach rozwoju.</p>
 <div class=row><span>Status</span><b>${S.warehouse.serviceCenter?"Wybudowane":"Brak"}</b></div>
 <button onclick="buildService()" ${S.warehouse.serviceCenter?"disabled":""}>Wybuduj · 190 000 zł</button>
 </div>
 <div class=card><h3>Odblokowania</h3>
 <p>Poziom 2 magazynu: większe kontrakty.</p>
 <p>Poziom 3: zlecenia specjalistyczne.</p>
 <p>Biurokracja poziom 1: możliwość zatrudnienia audytora BHP.</p>
 <p>Biurokracja zwiększa limit aktywnych kontraktów o 2 na poziom.</p>
 <p>Planowanie pracy poziom 1: druga zmiana.</p>
 <p>Planowanie pracy poziom 2: trzecia zmiana.</p>
 <p>IML i udrożnienie miejsc paletowych poprawiają płynność operacji.</p>
 </div>`;
 return html;
}
function buyUpgrade(k){
 let u=UPGRADES[k],lv=level(k);
 if(!u||lv>=u.cost.length)return;
 if(!charge(u.cost[lv])){alert("Brak środków.");return;}
 S.upgrades[k]=lv+1;log("Rozwinięto: "+u.name);render();
}
function buildService(){
 if(S.warehouse.serviceCenter||!charge(190000)){alert("Brak środków.");return;}
 S.warehouse.serviceCenter=true;log("Wybudowano centrum serwisowe.");render();
}

 return `<div class=card><h3>📋 Dziennik operacyjny</h3>${S.log.map(x=>`<p>• ${x}</p>`).join("")}</div>

if(!S.offers.length)generateOffers();
render();
requestAnimationFrame(tickFrame);
setInterval(saveGame,5000);
